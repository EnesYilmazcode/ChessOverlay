# Runs the test suite on GitHub's machines instead of on a developer's desktop.
#
# That distinction matters more here than in most projects. The suites used to
# paint a fullscreen always-on-top window across every monitor for the length of
# a run, so checking a change meant surrendering your screen, and in practice
# that meant the suites were run rarely and by one person. Nobody's screen is
# involved here.
#
# No xvfb. Nothing in the suite should need a display now, and handing it one
# anyway would let a test that quietly grows a display dependency keep passing
# in CI rather than failing where someone can see it. If a suite starts failing
# here for want of an X server, that is the finding, not the problem.
#
# Every suite is its own step with `if: always()`, because the first version of
# this file ran two suites in one step and the earlier failure meant the later
# suite never executed at all. The run reported a red mark for a suite that had
# not been run. One step per suite, so a red mark always names what actually
# broke.
#
# Stockfish is fetched rather than left out. Without a binary coachtest reports
# `engine: not found`, skips every check that touches the engine and still says
# it passed, so a green mark covered the wording helpers and nothing else. It
# goes into chesswatch/engine/, which is one of the four places find_engine()
# already looks, so the discovery path is exercised rather than bypassed with an
# environment variable. Pinned to a tag: an unpinned engine would make a red run
# ambiguous between this repository and a Stockfish release.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pieces.py uses int.bit_count, so 3.10 is the real floor. It is in the
        # matrix so that floor is measured rather than asserted; 3.13 is what
        # the app is developed against.
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: chesswatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # requirements.txt is unpinned, so a green run here is evidence about
      # today's mss, pillow and chess rather than about a fixed set of them.
      - run: pip install -r requirements.txt
      - name: stockfish
        working-directory: .
        run: |
          curl -sSfL -o sf.tar.gz "$SF/stockfish-linux-x86-64-universal.tar.gz"
          mkdir -p chesswatch/engine
          tar -xzf sf.tar.gz -C chesswatch/engine
        env:
          SF: https://github.com/official-stockfish/Stockfish/releases/download/sf_19
      - name: selftest
        if: always()
        run: python -X utf8 selftest.py
      - name: piecetest
        if: always()
        run: python -X utf8 piecetest.py
      - name: settletest
        if: always()
        run: python -X utf8 settletest.py
      - name: banktest
        if: always()
        run: python -X utf8 banktest.py
      - name: positiontest
        if: always()
        run: python -X utf8 positiontest.py
      - name: enrolltest
        if: always()
        run: python -X utf8 enrolltest.py
      - name: layouttest
        if: always()
        run: python -X utf8 layouttest.py
      - name: overlaytest
        if: always()
        run: python -X utf8 overlaytest.py
      - name: livetest
        if: always()
        run: python -X utf8 livetest.py
      # No display on this runner, so the checks that build the real app are
      # skipped here and run on the Windows job below, which has one.
      - name: coachtest
        if: always()
        run: python -X utf8 coachtest.py
        env:
          CHESSWATCH_NO_TK: "1"

  # The flag the coach starts Stockfish with, and the window it suppresses, only
  # exist on Windows, so that part of coachtest is about this job. It is also
  # the only runner with a display, so the checks that build the real app and
  # read its label run here and nowhere else. Only coachtest is here: the other
  # suites have never been looked at on a Windows runner, and a job that goes
  # red for an unrelated reason is worse than one that does not run.
  windows:
    name: windows, coachtest only
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chesswatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: stockfish
        working-directory: .
        shell: bash
        run: |
          curl -sSfL -o sf.zip "$SF/stockfish-windows-x86-64-universal.zip"
          mkdir -p chesswatch/engine
          unzip -q sf.zip -d chesswatch/engine
        env:
          SF: https://github.com/official-stockfish/Stockfish/releases/download/sf_19
      - run: python -X utf8 coachtest.py
